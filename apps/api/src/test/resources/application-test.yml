spring:
  datasource:
    hikari:
      # 테스트 클래스마다 Spring 컨텍스트가 하나씩 뜨고 각자 풀을 잡는다.
      # 운영 기본값(20)이면 컨텍스트 5개만 넘어가도 Postgres max_connections 를
      # 넘겨 "too many clients already" 로 무관한 테스트가 무더기로 깨진다.
      maximum-pool-size: 5
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

# presigned URL 서명에는 실제 MinIO 가 필요 없다 — 오프라인 연산이므로 테스트용 고정 키를 쓴다
litmood:
  storage:
    endpoint: http://localhost:9000
    bucket: litmood
    access-key: test-access-key
    secret-key: test-secret-key

logging:
  level:
    org.testcontainers: WARN
    com.github.dockerjava: WARN
