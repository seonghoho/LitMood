apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: litmood

resources:
  - api-deployment.yaml
  - api-service.yaml
  - api-hpa.yaml
  - web-deployment.yaml
  - web-service.yaml
  - ingress.yaml
  - configmap.yaml

# 시크릿은 매니페스트에 두지 않는다 (NFR-04).
# kubectl create secret generic litmood-api-secrets --from-env-file=.env.prod
# 또는 External Secrets Operator 로 주입한다.
