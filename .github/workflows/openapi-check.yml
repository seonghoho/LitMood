# ADR-008 — OpenAPI 를 API 계약의 단일 진실 원천으로 유지한다.
# 컨트롤러 변경이 스펙에 반영되지 않았거나, 의도치 않은 breaking change 가
# 포함된 PR 을 여기서 차단한다.
name: OpenAPI 계약 검사

on:
  pull_request:
    paths: ['apps/api/**', 'packages/api-client/openapi.yaml']

jobs:
  contract:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: litmood
          POSTGRES_USER: litmood
          POSTGRES_PASSWORD: litmood_local
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U litmood" --health-interval 5s
          --health-timeout 3s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '21', cache: gradle }

      - name: 애플리케이션 기동
        working-directory: apps/api
        env:
          DB_URL: jdbc:postgresql://localhost:5432/litmood
          DB_USERNAME: litmood
          DB_PASSWORD: litmood_local
          JWT_SECRET: ci-only-not-a-real-secret-value-padding-32b
        run: |
          ./gradlew bootRun --no-daemon &
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/actuator/health && break
            sleep 3
          done

      - name: 스펙 추출
        run: curl -sf http://localhost:8080/v3/api-docs.yaml -o /tmp/openapi.yaml

      - name: 커밋된 스펙과 비교
        run: |
          if [ ! -f packages/api-client/openapi.yaml ]; then
            echo "::warning::커밋된 스펙이 없습니다. 최초 생성 후 커밋하세요."
            exit 0
          fi
          if ! diff -u packages/api-client/openapi.yaml /tmp/openapi.yaml; then
            echo "::error::OpenAPI 스펙이 컨트롤러와 어긋납니다."
            echo "다음 명령으로 갱신 후 커밋하세요:"
            echo "  pnpm --filter @litmood/api-client fetch-spec"
            exit 1
          fi

      # 호환성 파괴 변경 탐지 — 프론트가 깨지기 전에 PR 단계에서 잡는다
      - name: Breaking change 검사
        uses: oasdiff/oasdiff-action/breaking@main
        continue-on-error: true
        with:
          base: 'https://raw.githubusercontent.com/${{ github.repository }}/${{ github.base_ref }}/packages/api-client/openapi.yaml'
          revision: /tmp/openapi.yaml
