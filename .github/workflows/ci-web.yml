name: CI (web)

on:
  push:
    branches: [master]
    paths: ['apps/web/**', 'packages/**', 'package.json', 'pnpm-lock.yaml', 'turbo.json']
  pull_request:
    paths: ['apps/web/**', 'packages/**', 'package.json', 'pnpm-lock.yaml', 'turbo.json']

concurrency:
  group: ci-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Turborepo 캐시로 변경되지 않은 패키지의 작업을 건너뛴다 (ADR-006)
      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Format check
        run: pnpm format:check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm build
