name: CI (api)

on:
  push:
    branches: [master]
    paths: ['apps/api/**']
  pull_request:
    paths: ['apps/api/**']

concurrency:
  group: ci-api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      # Testcontainers 가 실제 Postgres/Redis 를 띄운다 — H2 로는 jsonb/text[]/부분 인덱스를
      # 재현할 수 없다 (docs/06-infra.md). ubuntu-latest 러너에는 Docker 가 기본 제공된다.
      - name: Test
        working-directory: apps/api
        run: ./gradlew test --no-daemon

      - name: Build
        working-directory: apps/api
        run: ./gradlew bootJar --no-daemon

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: api-test-report
          path: apps/api/build/reports/tests/
          retention-days: 7
